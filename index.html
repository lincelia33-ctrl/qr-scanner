<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>資產掃描 Asset Scanner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0a;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── 頂部工具列 ── */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  position: relative;
  z-index: 10;
  flex-shrink: 0;
}
.toolbar-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.toolbar-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  margin-top: 2px;
}
.torch-btn {
  background: rgba(255,255,255,0.12);
  border: none;
  color: #fff;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 18px;
  cursor: pointer;
  transition: background 0.15s;
}
.torch-btn:active { background: rgba(255,255,255,0.25); }
.torch-btn.on { background: rgba(255,220,0,0.3); }

/* ── 相機區域 ── */
.cam-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
}
#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
#canvas { display: none; }

/* ── 掃描 overlay ── */
.scan-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.scan-box {
  width: min(70vw, 260px);
  aspect-ratio: 1;
  position: relative;
}

/* 四個角 */
.scan-box::before,
.scan-box::after,
.scan-box .c2::before,
.scan-box .c2::after {
  content: '';
  position: absolute;
  width: 26px;
  height: 26px;
  border-color: #fff;
  border-style: solid;
}
.scan-box::before  { top: 0;    left: 0;  border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
.scan-box::after   { top: 0;    right: 0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
.scan-box .c2::before { bottom: 0; left: 0;  border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
.scan-box .c2::after  { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

/* 掃描線 */
.scan-line {
  position: absolute;
  left: 4px;
  right: 4px;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, #4CAF50 30%, #a8ff78 50%, #4CAF50 70%, transparent 100%);
  border-radius: 2px;
  animation: scanline 2s ease-in-out infinite;
  box-shadow: 0 0 8px rgba(76,175,80,0.8);
}
@keyframes scanline {
  0%   { top: 4px;   opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { top: calc(100% - 6px); opacity: 0; }
}

/* 四邊半透明遮罩 */
.mask-top    { position: absolute; top: 0; left: 0; right: 0; bottom: calc(50% + min(35vw,130px)); background: rgba(0,0,0,0.5); }
.mask-bottom { position: absolute; top: calc(50% + min(35vw,130px)); left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); }
.mask-left   { position: absolute; top: calc(50% - min(35vw,130px)); left: 0; width: calc(50% - min(35vw,130px)); bottom: calc(50% - min(35vw,130px)); background: rgba(0,0,0,0.5); }
.mask-right  { position: absolute; top: calc(50% - min(35vw,130px)); right: 0; width: calc(50% - min(35vw,130px)); bottom: calc(50% - min(35vw,130px)); background: rgba(0,0,0,0.5); }

/* ── 底部狀態 ── */
.status-bar {
  padding: 16px 20px 20px;
  text-align: center;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  flex-shrink: 0;
  min-height: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.status-text {
  font-size: 14px;
  color: rgba(255,255,255,0.7);
  line-height: 1.5;
}
.status-text.ok  { color: #4CAF50; font-weight: 600; font-size: 16px; }
.status-text.err { color: #ff6b6b; }

.reload-btn {
  padding: 10px 28px;
  background: #4CAF50;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  margin-top: 4px;
}

/* ── 成功動畫 overlay ── */
.success-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.75);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  z-index: 20;
}
.success-overlay.show { display: flex; }
.success-icon {
  font-size: 64px;
  animation: popIn 0.3s ease-out;
}
.success-id {
  font-size: 18px;
  font-weight: 600;
  font-family: monospace;
  color: #4CAF50;
  background: rgba(76,175,80,0.15);
  padding: 8px 20px;
  border-radius: 10px;
  border: 1px solid rgba(76,175,80,0.4);
}
.success-msg {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
}
@keyframes popIn {
  from { transform: scale(0.5); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

/* ── 權限說明畫面 ── */
.permission-guide {
  display: none;
  position: absolute;
  inset: 0;
  background: #111;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 32px 28px;
  text-align: center;
  gap: 16px;
  z-index: 30;
}
.permission-guide.show { display: flex; }
.perm-icon { font-size: 56px; }
.perm-title { font-size: 20px; font-weight: 600; }
.perm-steps {
  font-size: 14px;
  color: rgba(255,255,255,0.65);
  line-height: 2;
  text-align: left;
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 14px 18px;
  width: 100%;
}
.perm-steps b { color: #fff; }
</style>
</head>
<body>

<!-- 頂部工具列 -->
<div class="toolbar">
  <div>
    <div class="toolbar-title">📦 資產掃描</div>
    <div class="toolbar-sub">Asset QR Scanner</div>
  </div>
  <button class="torch-btn" id="torchBtn" onclick="toggleTorch()" title="手電筒">🔦</button>
</div>

<!-- 相機區域 -->
<div class="cam-wrap" id="camWrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <!-- 遮罩 -->
  <div class="mask-top"></div>
  <div class="mask-bottom"></div>
  <div class="mask-left"></div>
  <div class="mask-right"></div>

  <!-- 瞄準框 -->
  <div class="scan-overlay">
    <div class="scan-box">
      <div class="c2"></div>
      <div class="scan-line"></div>
    </div>
  </div>

  <!-- 成功 overlay -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-icon">✅</div>
    <div class="success-id" id="successId"></div>
    <div class="success-msg">正在跳轉到資產系統...</div>
  </div>
</div>

<!-- 底部狀態 -->
<div class="status-bar">
  <div class="status-text" id="statusText">開啟相機中...</div>
</div>

<!-- 相機權限說明 -->
<div class="permission-guide" id="permGuide">
  <div class="perm-icon">📷</div>
  <div class="perm-title">需要相機權限</div>
  <div class="perm-steps">
    <b>iPhone / Safari：</b><br>
    點網址列左側 <b>「aA」</b> → 網站設定 → 相機 → 允許<br><br>
    <b>Android / Chrome：</b><br>
    點網址列右側 <b>「⋮」</b> → 網站設定 → 相機 → 允許
  </div>
  <button class="reload-btn" onclick="location.reload()">🔄 已允許，重新整理</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════
// ★ 請把下面這個網址換成你的 GAS Web App 網址 ★
// ══════════════════════════════════════════════════════════
var GAS_URL = 'https://script.google.com/a/macros/cycraft.com/s/AKfycbxVU2c8_rohQFO4bw5_l-Bu6nZ_ZJSSxaDMhSmxJ1ic2JPBwwz0F-YxLjoCRv_5p__mZg/exec';
// ══════════════════════════════════════════════════════════

var stream   = null;
var timer    = null;
var done     = false;
var torchOn  = false;

function init() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showErr('此裝置不支援相機 API<br>請使用 Chrome 或 Safari');
    return;
  }

  var constraints = {
    video: {
      facingMode: { ideal: 'environment' },
      width:  { ideal: 1920 },
      height: { ideal: 1920 }
    }
  };

  navigator.mediaDevices.getUserMedia(constraints)
    .then(function(s) {
      stream = s;
      var v = document.getElementById('video');
      v.srcObject = s;
      v.addEventListener('loadedmetadata', function() {
        v.play();
        setStatus('對準 QR Code，自動偵測中...');
        timer = setInterval(scanFrame, 80);
      });
    })
    .catch(function(err) {
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        document.getElementById('permGuide').classList.add('show');
        setStatus('需要相機授權');
      } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
        showErr('找不到相機裝置');
      } else if (err.name === 'NotReadableError') {
        showErr('相機被其他程式佔用，請關閉後重試');
      } else {
        showErr('相機錯誤：' + err.name);
      }
    });
}

function scanFrame() {
  if (done) return;
  var v = document.getElementById('video');
  if (!v || v.readyState < 2 || v.paused) return;
  var w = v.videoWidth, h = v.videoHeight;
  if (!w || !h) return;

  var c   = document.getElementById('canvas');
  c.width = w; c.height = h;
  var ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(v, 0, 0, w, h);

  // 嘗試解碼
  var imgData = ctx.getImageData(0, 0, w, h);
  var result  = jsQR(imgData.data, w, h, { inversionAttempts: 'dontInvert' });

  if (!result) {
    // 二值化再試一次（提高低光環境成功率）
    var d = imgData.data;
    for (var i = 0; i < d.length; i += 4) {
      var g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      d[i] = d[i+1] = d[i+2] = g > 128 ? 255 : 0;
    }
    ctx.putImageData(imgData, 0, 0);
    result = jsQR(imgData.data, w, h, { inversionAttempts: 'attemptBoth' });
  }

  if (result && result.data) {
    onDetected(result.data);
  }
}

function onDetected(raw) {
  done = true;
  clearInterval(timer);
  if (stream) stream.getTracks().forEach(function(t) { t.stop(); });

  var assetId = parseAssetId(raw);

  // 顯示成功畫面
  document.getElementById('successId').textContent = assetId;
  document.getElementById('successOverlay').classList.add('show');
  setStatus('掃描成功 ✅');

  // 跳轉到 GAS 資產系統
  setTimeout(function() {
    window.location.href = GAS_URL + '?id=' + encodeURIComponent(assetId);
  }, 900);
}

function parseAssetId(raw) {
  var s = raw.trim();
  // 若是 URL 格式（含 ?id=），取出 id
  var idIdx = s.indexOf('id=');
  if (idIdx >= 0) {
    var after = s.substring(idIdx + 3);
    var amp   = after.indexOf('&');
    return decodeURIComponent(amp >= 0 ? after.substring(0, amp) : after);
  }
  return s;
}

// 手電筒（部分 Android 支援）
function toggleTorch() {
  if (!stream) return;
  var track = stream.getVideoTracks()[0];
  if (!track || !track.getCapabilities) return;
  var caps = track.getCapabilities();
  if (!caps.torch) return;
  torchOn = !torchOn;
  track.applyConstraints({ advanced: [{ torch: torchOn }] });
  var btn = document.getElementById('torchBtn');
  btn.classList.toggle('on', torchOn);
}

function setStatus(msg) {
  var el = document.getElementById('statusText');
  el.className = 'status-text';
  el.innerHTML = msg;
}

function showErr(msg) {
  var el = document.getElementById('statusText');
  el.className = 'status-text err';
  el.innerHTML = msg;
}

window.addEventListener('load', init);
window.addEventListener('beforeunload', function() {
  clearInterval(timer);
  if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
});
</script>
</body>
</html>
