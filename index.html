<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>資產掃描 Asset Scanner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0a0a0a;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
}

/* ── 開始畫面 ── */
#startScreen{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#0f1923 0%,#0d1f0d 100%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:24px;z-index:100;padding:32px;
}
#startBtn{
  width:min(80vw,280px);
  padding:22px 0;
  background:linear-gradient(135deg,#2d7a2d,#4CAF50);
  color:#fff;border:none;border-radius:20px;
  font-size:20px;font-weight:700;
  cursor:pointer;
  font-family:inherit;
  box-shadow:0 8px 32px rgba(76,175,80,0.4);
  transition:transform 0.1s,box-shadow 0.1s;
  -webkit-tap-highlight-color:transparent;
}
#startBtn:active{transform:scale(0.96);box-shadow:0 4px 16px rgba(76,175,80,0.3)}
.start-icon{font-size:72px;line-height:1}
.start-title{font-size:22px;font-weight:600;letter-spacing:0.02em}
.start-sub{font-size:14px;color:rgba(255,255,255,0.45);text-align:center;line-height:1.6}

/* ── 相機畫面 ── */
#camScreen{display:none;flex:1;flex-direction:column}
video{width:100%;height:100%;object-fit:cover;display:block;flex:1}
canvas{display:none}

.cam-wrap{flex:1;position:relative;overflow:hidden}
.mask{position:absolute;background:rgba(0,0,0,0.55)}
.mask-t{top:0;left:0;right:0;bottom:calc(50% + min(33vw,140px))}
.mask-b{top:calc(50% + min(33vw,140px));left:0;right:0;bottom:0}
.mask-l{top:calc(50% - min(33vw,140px));left:0;width:calc(50% - min(33vw,140px));bottom:calc(50% - min(33vw,140px))}
.mask-r{top:calc(50% - min(33vw,140px));right:0;width:calc(50% - min(33vw,140px));bottom:calc(50% - min(33vw,140px))}

.aim{
  position:absolute;
  top:50%;left:50%;
  width:min(66vw,280px);aspect-ratio:1;
  transform:translate(-50%,-50%);
}
.c{position:absolute;width:24px;height:24px;border-color:#fff;border-style:solid}
.tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.scanline{
  position:absolute;left:3px;right:3px;height:2px;
  background:linear-gradient(90deg,transparent,#4CAF50 30%,#a8ff78 50%,#4CAF50 70%,transparent);
  box-shadow:0 0 8px rgba(76,175,80,0.9);
  animation:sl 2s ease-in-out infinite;
}
@keyframes sl{0%{top:3px;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:calc(100% - 5px);opacity:0}}

.status-bar{
  padding:14px 20px 18px;text-align:center;
  background:rgba(0,0,0,0.75);
  font-size:14px;color:rgba(255,255,255,0.7);
  min-height:56px;
}

/* ── 成功畫面 ── */
#successScreen{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.85);
  flex-direction:column;align-items:center;justify-content:center;
  gap:16px;z-index:200;
}
.suc-icon{font-size:72px;animation:pop 0.3s ease-out}
.suc-id{
  font-size:18px;font-weight:600;font-family:monospace;
  color:#4CAF50;background:rgba(76,175,80,0.12);
  padding:10px 24px;border-radius:12px;
  border:1px solid rgba(76,175,80,0.35);
}
.suc-msg{font-size:13px;color:rgba(255,255,255,0.5)}
@keyframes pop{from{transform:scale(0.4);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<!-- ══ 開始畫面：頁面載入後立即顯示，等待使用者點擊 ══ -->
<div id="startScreen">
  <div class="start-icon">📦</div>
  <div class="start-title">資產 QR 掃描</div>
  <div class="start-sub">點擊下方按鈕開啟相機<br>對準設備上的 QR Code 即可自動掃描</div>
  <!--
    ★ 關鍵：getUserMedia 直接在這個 onclick 裡呼叫
    ★ 不做任何 reload、跳轉，就在這個點擊事件內直接執行
    ★ 這樣瀏覽器確認是 "transient user activation"，不會擋
  -->
  <button id="startBtn" onclick="startCamera()">
    📷 開啟相機掃描
  </button>
</div>

<!-- ══ 相機畫面 ══ -->
<div id="camScreen">
  <div class="cam-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="mask mask-t"></div>
    <div class="mask mask-b"></div>
    <div class="mask mask-l"></div>
    <div class="mask mask-r"></div>
    <div class="aim">
      <div class="c tl"></div><div class="c tr"></div>
      <div class="c bl"></div><div class="c br"></div>
      <div class="scanline"></div>
    </div>
  </div>
  <div class="status-bar" id="statusBar">對準 QR Code，自動偵測中...</div>
</div>

<!-- ══ 成功畫面 ══ -->
<div id="successScreen">
  <div class="suc-icon">✅</div>
  <div class="suc-id" id="sucId"></div>
  <div class="suc-msg">正在跳轉到資產系統...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════
// ★ 換成你的 GAS Web App 網址 ★
var GAS_URL = 'https://script.google.com/a/macros/cycraft.com/s/AKfycbxVU2c8_rohQFO4bw5_l-Bu6nZ_ZJSSxaDMhSmxJ1ic2JPBwwz0F-YxLjoCRv_5p__mZg/exec';
// ══════════════════════════════════════════════════════════

var scanTimer = null;
var mediaStream = null;
var done = false;

// ── 核心：直接在 onclick 裡呼叫 getUserMedia ──────────────
// 不做 reload、不做跳轉，getUserMedia 在點擊事件的同步呼叫鏈裡
function startCamera() {
  // 立刻隱藏開始畫面，顯示相機畫面（先給使用者視覺回饋）
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('camScreen').style.display = 'flex';
  document.getElementById('camScreen').style.flexDirection = 'column';
  document.getElementById('statusBar').textContent = '開啟相機中...';

  // 直接呼叫 getUserMedia（在點擊事件內，瀏覽器一定允許詢問）
  navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width:  { ideal: 1920 },
      height: { ideal: 1920 }
    }
  })
  .then(function(stream) {
    mediaStream = stream;
    var v = document.getElementById('video');
    v.srcObject = stream;
    v.addEventListener('loadedmetadata', function() {
      v.play();
      document.getElementById('statusBar').textContent = '對準 QR Code，自動偵測中...';
      scanTimer = setInterval(scanFrame, 80);
    });
  })
  .catch(function(err) {
    document.getElementById('camScreen').style.display = 'none';
    document.getElementById('startScreen').style.display = 'flex';
    // 更新開始按鈕顯示錯誤
    var btn = document.getElementById('startBtn');
    if (err.name === 'NotAllowedError') {
      btn.textContent = '⚠️ 請允許相機後再試';
      btn.style.background = 'linear-gradient(135deg,#7a2d2d,#c0392b)';
      document.querySelector('.start-sub').innerHTML =
        '<b style="color:#ff8a80">請允許此網頁使用相機</b><br>' +
        'iPhone：網址列點「aA」→ 網站設定 → 相機 → 允許<br>' +
        'Android：網址列點「⋮」→ 網站設定 → 相機 → 允許<br>' +
        '允許後再點按鈕一次';
    } else {
      btn.textContent = '❌ ' + err.name + '，點此重試';
      btn.style.background = 'linear-gradient(135deg,#7a2d2d,#c0392b)';
    }
  });
}

// ── 掃描 ──────────────────────────────────────────────────
function scanFrame() {
  if (done) return;
  var v = document.getElementById('video');
  if (!v || v.readyState < 2 || v.paused) return;
  var w = v.videoWidth, h = v.videoHeight;
  if (!w || !h) return;

  var c = document.getElementById('canvas');
  c.width = w; c.height = h;
  var ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(v, 0, 0, w, h);

  var imgData = ctx.getImageData(0, 0, w, h);
  var result  = jsQR(imgData.data, w, h, { inversionAttempts: 'dontInvert' });

  if (!result) {
    // 二值化再試（低光環境）
    var d = imgData.data;
    for (var i = 0; i < d.length; i += 4) {
      var g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      d[i] = d[i+1] = d[i+2] = g > 128 ? 255 : 0;
    }
    ctx.putImageData(imgData, 0, 0);
    result = jsQR(imgData.data, w, h, { inversionAttempts: 'attemptBoth' });
  }

  if (result && result.data) onDetected(result.data);
}

// ── 偵測到 QR Code ────────────────────────────────────────
function onDetected(raw) {
  done = true;
  clearInterval(scanTimer);
  if (mediaStream) mediaStream.getTracks().forEach(function(t) { t.stop(); });

  var assetId = parseAssetId(raw);

  // 顯示成功畫面
  document.getElementById('sucId').textContent = assetId;
  document.getElementById('camScreen').style.display = 'none';
  document.getElementById('successScreen').style.display = 'flex';

  // 存到 sessionStorage，讓 GAS 回來後能帶入欄位
  try { sessionStorage.setItem('qr_result', assetId); } catch(e) {}

  // 跳回 GAS 資產系統（出借登記頁）
  setTimeout(function() {
    window.location.href = GAS_URL + '?id=' + encodeURIComponent(assetId);
  }, 900);
}

function parseAssetId(raw) {
  var s = raw.trim();
  var idIdx = s.indexOf('id=');
  if (idIdx >= 0) {
    var after = s.substring(idIdx + 3);
    var amp   = after.indexOf('&');
    return decodeURIComponent(amp >= 0 ? after.substring(0, amp) : after);
  }
  return s;
}

window.addEventListener('beforeunload', function() {
  clearInterval(scanTimer);
  if (mediaStream) mediaStream.getTracks().forEach(function(t) { t.stop(); });
});
</script>
</body>
</html>
